# Piro CLI configuration for local development against the API on :5117.
# Safe to commit: it holds no credentials. Authenticate with `piro login`,
# or set PIRO_API_KEY for non-interactive use.

current: local

instances:
  local:
    url: http://localhost:5117
    # The consent screen for `piro login` is an admin-panel route. In development the panel and the
    # API are served separately, so it needs its own origin; behind the usual proxy they share one
    # and this can be omitted.
    admin_url: http://localhost:5174
    config: ./services/
