# yaml-language-server: $schema=https://raw.githubusercontent.com/Heva-Co/piro/main/schema/piro.schema.json
version: 1

# Everything this file does not declare, it does not touch: fields set in the admin panel survive an
# apply, and resources absent from these files are left alone unless you pass --prune.

services:
  - slug: example-api
    name: Example API
    description: Sample service for trying the CLI locally
    checks:
      - slug: health
        name: Health endpoint
        type: HTTP
        cron: "*/5 * * * *"
        type_data:
          url: https://example.com/
          method: GET
          timeout: 5000
          followRedirects: true
        alert_configs:
          - dimension: Status
            alert_value: DOWN
            failure_threshold: 2
            severity: Critical
