name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Path filters ────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Every filter includes this workflow, so a change to CI actually exercises the jobs it
            # changes. Without it a PR that only edits ci.yml skips every job and reports a green
            # tick that proves nothing.
            backend:
              - 'src/**'
              - '*.slnx'
              - '*.sln'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - 'src/Piro.Worker/Dockerfile'
              - 'apps/web/Dockerfile'
              - 'nginx/Dockerfile'
              # The proxy image builds the admin SPA, so its sources matter too.
              - 'apps/admin/**'
              # Adding or renaming a project changes what the Dockerfiles must
              # restore, so rebuild the images on any .csproj/solution change.
              # Without this the image build only ran when a Dockerfile itself
              # changed, and a new project could break the release build.
              - '**/*.csproj'
              - '*.slnx'
              - '.github/workflows/ci.yml'

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build API
        run: dotnet build src/Piro.Api/Piro.Api.csproj --no-restore -c Release

      - name: Build Worker
        run: dotnet build src/Piro.Worker/Piro.Worker.csproj --no-restore -c Release

      # Runs unit tests and integration tests. The integration suite provisions its own Postgres via
      # Testcontainers, which uses the Docker daemon preinstalled on GitHub-hosted ubuntu runners.
      - name: Test
        run: dotnet test Piro.slnx --no-restore -c Release --verbosity normal

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/admin/pnpm-lock.yaml

      - name: Install (web)
        working-directory: apps/web
        run: pnpm install

      # Build before the standalone type check, and not the other way round: Next generates the
      # route-aware `PageProps`/`LayoutProps` globals into .next/types during the build, so a
      # bare tsc run on a clean checkout cannot resolve them and fails on a page that uses one.
      # `next build` type-checks the app itself, so this order also means a type error still
      # fails the job, just from the build step instead.
      - name: Build (web)
        working-directory: apps/web
        run: pnpm build

      # Now that the generated types exist, this catches anything outside the app router that
      # `next build` does not cover.
      - name: Type check (web)
        working-directory: apps/web
        run: pnpm tsc --noEmit

      - name: Install (admin)
        working-directory: apps/admin
        run: pnpm install

      # `pnpm build` here is `tsc -b && vite build`, so the type check is part of the build and
      # needs no separate step. Project references make `-b` the accurate check anyway: a plain
      # --noEmit run can under-report errors against a composite project's cached state.
      - name: Build (admin)
        working-directory: apps/admin
        run: pnpm build

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Piro.Worker/Dockerfile
          push: false
          platforms: linux/amd64

      # The web Dockerfile expects apps/web as its context, not the repo root.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          platforms: linux/amd64

      # There is no apps/admin/Dockerfile: the admin SPA is built inside
      # nginx/Dockerfile and served by the proxy image below.
      - name: Build proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: false
          platforms: linux/amd64
