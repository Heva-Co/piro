name: Release

on:
  release:
    types: [published]

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    steps:
      - name: Extract version
        id: version
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build-docker-api:
    name: Docker — API
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/heva-co/piro-api:v${{ needs.resolve-version.outputs.version }}
            ${{ needs.resolve-version.outputs.latest_tag && format('ghcr.io/heva-co/piro-api:{0}', needs.resolve-version.outputs.latest_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}

  build-docker-worker:
    name: Docker — Worker
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Piro.Worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/heva-co/piro-worker:v${{ needs.resolve-version.outputs.version }}
            ${{ needs.resolve-version.outputs.latest_tag && format('ghcr.io/heva-co/piro-worker:{0}', needs.resolve-version.outputs.latest_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}

  build-docker-web:
    name: Docker — Web
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/heva-co/piro-web:v${{ needs.resolve-version.outputs.version }}
            ${{ needs.resolve-version.outputs.latest_tag && format('ghcr.io/heva-co/piro-web:{0}', needs.resolve-version.outputs.latest_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-proxy:
    name: Docker — Proxy
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/heva-co/piro-proxy:v${{ needs.resolve-version.outputs.version }}
            ${{ needs.resolve-version.outputs.latest_tag && format('ghcr.io/heva-co/piro-proxy:{0}', needs.resolve-version.outputs.latest_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cli:
    name: CLI — ${{ matrix.target }}
    needs: resolve-version
    # NativeAOT cannot cross-compile, so each OS needs its own runner. Linux arm64 is built on an
    # arm64 runner for the same reason.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          # Apple Silicon only — Intel Macs are not a supported target. Pinned rather than
          # macos-latest because there is no forward-compatible arm64 alias, so this needs bumping
          # when the image is retired.
          - target: osx-arm64
            runner: macos-26-arm64
          - target: win-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT prerequisites
        if: startsWith(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: >
          dotnet publish src/Piro.Cli
          -r ${{ matrix.target }}
          -c Release
          -o publish
          -p:Version=${{ needs.resolve-version.outputs.version }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # One archive per platform, named so a download is self-describing. zip on Windows because
          # tar.gz is awkward there; tar.gz elsewhere because it preserves the executable bit.
          if [ "${TARGET}" = "win-x64" ]; then
            7z a "piro-${VERSION}-${TARGET}.zip" ./publish/piro.exe
            echo "asset=piro-${VERSION}-${TARGET}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "piro-${VERSION}-${TARGET}.tar.gz" -C publish piro
            echo "asset=piro-${VERSION}-${TARGET}.tar.gz" >> "$GITHUB_ENV"
          fi

      # The exact filename, not a glob: a glob that matches nothing makes gh fail, and only one
      # archive exists per runner.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$asset" --clobber

  attach-release-assets:
    name: Attach docker-compose.yml to release
    needs: [resolve-version, build-docker-api, build-docker-worker, build-docker-web, build-docker-proxy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin image versions in docker-compose.yml
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          sed "s|\${PIRO_VERSION:-latest}|v${VERSION}|g" docker-compose.yml > docker-compose.release.yml

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" docker-compose.release.yml --clobber
