# XcodeGen spec for the Piro on-call iOS app.
#
# The .xcodeproj is generated from this file (`xcodegen generate` in this directory), so the project
# definition lives in reviewable YAML rather than an opaque .pbxproj. The generated project is also
# committed so teammates can open it in Xcode without installing xcodegen.
#
# The app is a native SwiftUI shell that consumes the KMP `Shared` framework (business logic, API,
# models, Keychain). A pre-build script asks Gradle to build & embed the framework for whatever
# SDK/arch/configuration Xcode is compiling — the canonical KMP ↔ Xcode integration.
name: Piro
options:
  bundleIdPrefix: co.heva
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Gradle needs to shell out during the build phase; keep the script sandbox off.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Piro:
    type: application
    platform: iOS
    sources:
      - path: Piro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.heva.piro
        PRODUCT_NAME: Piro
        INFOPLIST_FILE: Piro/Info.plist
        CODE_SIGN_ENTITLEMENTS: Piro/Piro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Where Gradle drops the built Shared.framework for the current CONFIGURATION/SDK.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build Shared KMP framework (Gradle)"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Xcode's build environment has no JAVA_HOME/PATH java; fall back to Android Studio's JBR.
          if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            if [ -x "/Applications/Android Studio.app/Contents/jbr/Contents/Home/bin/java" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
